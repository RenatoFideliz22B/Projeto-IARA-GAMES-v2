<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- CSS -->
    <link rel="stylesheet" href="../css/cadastro.css">

    <!-- Google Fonts --> 
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bitcount+Prop+Double+Ink:wght@100..900&family=Red+Hat+Display:ital,wght@0,300;1,300&display=swap" rel="stylesheet">

    <!-- Ícones -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <title>Criar Conta</title>
</head>

<body>

<!-- vídeo de fundo -->
<video class="video" autoplay muted loop playsinline>
    <source src="../videos/gamer.mp4" type="video/mp4">
</video>

<main>

    <!-- FORM DE BUSCA (AGORA ACIMA DO CADASTRO) -->
    <form id="form-search" name="form-search" method="get" action="" class="form-search">
        <input type="search" id="text-search" name="text-search" class="text-search"
            placeholder="Digite o usuário" required>
        <button type="submit" id="btn-search" name="btn-search" class="btn-form">Buscar</button>
    </form>

    <!-- FORM CADASTRO -->
    <form id="form-cadastro" name="form-cadastro" method="post" action="" class="form-cadastro">
        <fieldset>
            <legend>Dados do usuário</legend>

            <section class="form-campos">

                <div class="span-2">
                    <label for="nome-usuario">Nome completo</label>
                    <div class="form-field">
                        <input type="text" name="nome-usuario" id="nome-usuario"
                            required minlength="5" maxlength="50"
                            placeholder="Ex: Fulano de Tal">
                        <i class="fa-regular fa-user icon"></i>
                    </div>
                </div>

                <div>
                    <label for="senha-usuario">Senha</label>
                    <div class="form-field">
                        <input type="password" name="senha-usuario" id="senha-usuario"
                            required minlength="5" maxlength="20"
                            placeholder="Ex: @#$abcd&">
                        <i class="fa-solid fa-key icon"></i>
                    </div>
                </div>

                <div>
                    <label for="email-usuario">E-mail</label>
                    <div class="form-field">
                        <input type="email" name="email-usuario" id="email-usuario"
                            required maxlength="50"
                            placeholder="Ex: email@email.com">
                        <i class="fa-solid fa-at icon"></i>
                    </div>
                </div>

                <div>
                    <label for="tel-usuario">Telefone</label>
                    <div class="form-field">
                        <input type="tel" name="tel-usuario" id="tel-usuario"
                            required
                            pattern="\(\d{2}\)\s\d{4,5}-\d{4}"
                            placeholder="Ex: (11) 91234-5678">
                        <i class="fa-solid fa-phone-flip icon"></i>
                    </div>
                </div>

                <div>
                    <label for="site-usuario">Site</label>
                    <div class="form-field">
                        <input type="url" name="site-usuario" id="site-usuario"
                            placeholder="https://seusite.com.br">
                        <i class="fa-solid fa-link icon"></i>
                    </div>
                </div>

                <div>
                    <label for="data">Data</label>
                    <div class="form-field">
                        <input type="date" name="data" id="data" required>
                        <i class="fa-regular fa-calendar icon"></i>
                    </div>
                </div>

                <div>
                    <label for="tipo-conta">Tipo de conta</label>
                    <div class="form-field">
                        <select name="tipo-conta" id="tipo-conta" required>
                            <option value="" disabled selected>Selecione</option>
                            <option value="Free">Free</option>
                            <option value="Premium">Premium</option>
                            <option value="Vip">Vip</option>
                        </select>
                        <i class="fa-solid fa-angle-down icon"></i>
                    </div>
                </div>

            </section>

            <div class="btn-container">
                <button type="submit" class="btn-form">
                    Criar conta <i class="fa-solid fa-rocket"></i>
                </button>
            </div>

        </fieldset>
    </form>

</main>
    <!-- script para estruturar numeros de telefone -->
<script src="https://unpkg.com/imask"></script>
<script src="../js/telMask.js"></script>

</body>
</html>
